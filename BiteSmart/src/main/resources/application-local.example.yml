# BiteSmart 本地/交付配置模板。
# 使用方式：复制本文件为 application-local.yml，然后把所有 TODO 值替换成对方提供的账号和密钥。
# 注意：application-local.yml 里会放真实密钥，不要提交到 Git。

server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://TODO_MYSQL_HOST:3306/bitesmart?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
    username: TODO_MYSQL_USERNAME
    password: TODO_MYSQL_PASSWORD
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    redis:
      host: TODO_REDIS_HOST
      port: 6379
      password: TODO_REDIS_PASSWORD
      database: 0

jwt:
  secret: TODO_CHANGE_TO_A_LONG_RANDOM_SECRET
  expiration: 86400000
  refresh-expiration: 2592000000

file:
  upload-dir: ./uploads
  max-size: 10485760
  allowed-types: image/jpeg,image/png,image/gif,application/pdf

# AI 接口。当前后端按 OpenAI 兼容的 chat completions 返回格式解析。
# DeepSeek 示例：
#   api-url: https://api.deepseek.com/v1/chat/completions
#   model: deepseek-chat
ai:
  api-key: TODO_AI_API_KEY
  api-url: https://api.deepseek.com/v1/chat/completions
  model: deepseek-chat

# 微信小程序登录。
# 这里填后端使用的 AppID/AppSecret；同时还要把 BiteSmartMin/project.config.json 里的 appid 改成同一个 AppID。
wechat:
  mini-program:
    app-id: TODO_WECHAT_MINI_APP_ID
    app-secret: TODO_WECHAT_MINI_APP_SECRET

# 支付宝沙箱支付。
# 沙箱买家账号只用于测试付款登录，不写进项目配置文件。
alipay:
  enabled: true
  app-id: TODO_ALIPAY_APP_ID
  private-key: TODO_ALIPAY_APP_PRIVATE_KEY
  public-key: TODO_ALIPAY_PUBLIC_KEY
  gateway-url: https://openapi-sandbox.dl.alipaydev.com/gateway.do
  notify-url: https://TODO_PUBLIC_DOMAIN/api/payment/alipay/notify
  return-url: http://localhost:5173/user/orders
  membership-return-url: http://localhost:5173/user/membership
  sign-type: RSA2
  charset: UTF-8
  format: json

logging:
  level:
    root: INFO
    com.ws.bitesmart: INFO
    org.springframework.security: WARN
