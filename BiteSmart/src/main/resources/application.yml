# ============================================================
# BiteSmart 智能健康膳食管理平台 - 应用配置
# ============================================================

server:
  port: 8080

spring:
  application:
    name: BiteSmart

  # 数据源配置
  datasource:
    url: jdbc:mysql://localhost:3306/bitesmart?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8mb4&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 30000

  # Redis 配置
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

# MyBatis 配置
mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.ws.bitesmart.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# PageHelper 分页配置
pagehelper:
  helper-dialect: mysql
  reasonable: true
  support-methods-arguments: true

# JWT 配置
jwt:
  secret: BiteSmart-JWT-Secret-Key-2026-Security
  expiration: 86400000        # 24小时，单位毫秒
  refresh-expiration: 2592000000  # 30天，单位毫秒

# 日志配置
logging:
  level:
    root: INFO
    com.ws.bitesmart: DEBUG
    org.springframework.security: INFO
